<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>umans-gate</title>
<link rel="stylesheet" href="/dashboard/style.css" />
</head>
<body>
<div id="app">
  <aside id="list">
    <header class="topbar">
      <h1>Captures <span id="count" class="muted"></span></h1>
      <button id="clear" title="Delete all captures">Clear</button>
    </header>
    <div id="ws-state" class="ws-state"></div>
    <div id="items"></div>
  </aside>
  <main id="detail">
    <div id="empty" class="empty-state">
      <div class="big">⌖</div>
      <p>Select a capture to inspect</p>
      <p class="muted small">Requests appear here automatically as they flow through the proxy.</p>
    </div>
  </main>
</div>
<script src="/dashboard/app.js"></script>
</body>
</html>
