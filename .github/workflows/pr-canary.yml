name: PR Canary

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  canary:
    name: Publish canary package
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Bump canary version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          PR_NUMBER="${{ github.event.pull_request.number }}"
          RUN_ATTEMPT="${{ github.run_attempt }}"
          CANARY_VERSION="${BASE_VERSION}-pr.${PR_NUMBER}.${RUN_ATTEMPT}"
          npm version "${CANARY_VERSION}" --no-git-tag-version
          echo "version=${CANARY_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish canary package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag canary --provenance --access public

      - name: Comment install command on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const body = [
              `<!-- umans-gate-canary -->`,
              `## Canary package published`,
              ``,
              `Install this PR's build:`,
              ``,
              "```bash",
              `npm install umans-gate@${version}`,
              "```",
              ``,
              `Or track the rolling canary tag:`,
              ``,
              "```bash",
              `npm install umans-gate@canary`,
              "```",
              ``,
              `> This comment is auto-updated on each push to this PR.`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = "<!-- umans-gate-canary -->";
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
