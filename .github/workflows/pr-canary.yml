name: PR Canary

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  canary:
    name: Publish canary package
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Compute canary version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          PR_NUMBER="${{ github.event.pull_request.number || github.run_id }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          CANARY_VERSION="${BASE_VERSION}-pr.${PR_NUMBER}.${SHORT_SHA}"
          echo "version=${CANARY_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile

      - name: Build dashboard
        run: bun run build:dashboard

      - name: Generate embedded assets
        run: bun run build:embed-assets

      - name: Build server type declarations
        run: bun run build:server

      - name: Build standalone executables (all 6 platforms)
        run: |
          mkdir -p release
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            ext=""
            [[ "$target" == win32-* ]] && ext=".exe"
            bun build --compile --target="bun-${target}" ./src/cli.ts --outfile "release/umans-gate-${target}${ext}"
          done

      - name: Assemble npm packages
        run: bash scripts/pack-npm.sh "${{ steps.version.outputs.version }}"

      - name: Publish platform packages to npm (canary tag)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true
        run: |
          for dir in release/npm/@codegiveness/umans-gate-*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "⏭️  ${name}@${version} already published — skipping"
              continue
            fi
            for attempt in 1 2 3; do
              if (cd "$dir" && npm publish --tag canary --provenance --access public 2>&1); then
                echo "✅ Published ${name} (attempt ${attempt})"
                break
              elif [ "$attempt" -eq 3 ]; then
                echo "⚠️  Failed to publish ${name} after 3 attempts — continuing anyway"
              else
                echo "⏳ Retrying ${name} in 15s..."
                sleep 15
              fi
            done
          done

      - name: Publish main shim package to npm (canary tag)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd release/npm/main
          version=$(node -p "require('./package.json').version")
          if npm view "umans-gate@${version}" version >/dev/null 2>&1; then
            echo "⏭️  umans-gate@${version} already published — skipping"
            exit 0
          fi
          for attempt in 1 2 3; do
            if npm publish --tag canary --provenance --access public 2>&1; then
              echo "✅ Published umans-gate (attempt ${attempt})"
              break
            elif [ "$attempt" -eq 3 ]; then
              echo "❌ Failed to publish umans-gate after 3 attempts"
              exit 1
            else
              echo "⏳ Retrying umans-gate in 15s..."
              sleep 15
            fi
          done

      - name: Comment install command on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const body = [
              `<!-- umans-gate-canary -->`,
              `## Canary package published`,
              ``,
              `Install this PR's build:`,
              ``,
              "```bash",
              `npm install umans-gate@${version}`,
              "```",
              ``,
              `Or track the rolling canary tag:`,
              ``,
              "```bash",
              `npm install umans-gate@canary`,
              "```",
              ``,
              `> This comment is auto-updated on each push to this PR.`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = "<!-- umans-gate-canary -->";
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
