name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: bun install

      - name: Install dashboard dependencies
        run: cd dashboard && bun install

      - name: Build
        run: bun run build

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view umans-gate@$VERSION version >/dev/null 2>&1; then
            echo "already-published=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already published"
          else
            echo "already-published=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION not yet published"
          fi

      - name: Publish to npm
        if: steps.check.outputs.already-published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for registry propagation
        if: steps.check.outputs.already-published != 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            if npm view umans-gate@$VERSION version >/dev/null 2>&1; then
              echo "Version $VERSION is now visible on npm"
              exit 0
            fi
            echo "Waiting for registry propagation... ($i/30)"
            sleep 10
          done
          echo "Registry propagation timeout"
          exit 1
