name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without v prefix)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  # Pre-release validation: ensure version consistency + docs integrity
  # before building/publishing anything. Fails fast if anything is off.
  validate:
    name: Pre-release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Validate version consistency
        run: bun run scripts/sync-version.ts

      - name: Validate docs (links + structure)
        run: bun run scripts/update-docs.ts

      - name: Validate CHANGELOG has release notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES=$(awk "/^## \[${VERSION}\]/{f=1; next} f && /^## \[/{exit} f" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "❌ CHANGELOG.md has no content under [${VERSION}]"
            exit 1
          fi
          echo "✅ CHANGELOG has release notes for ${VERSION}"

      - name: Verify git tag matches version
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if [ -n "${GITHUB_REF#refs/tags/}" ] && [ "${GITHUB_REF#refs/tags/}" != "v${VERSION}" ]; then
            echo "❌ Tag ${GITHUB_REF#refs/tags/} does not match package.json version v${VERSION}"
            exit 1
          fi
          echo "✅ Tag matches version"

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - run: bun install --frozen-lockfile

      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile

      - name: Extract version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build dashboard
        run: bun run build:dashboard

      - name: Generate embedded-assets.ts from dashboard build
        run: bun run scripts/embed-assets.ts

      - name: Build server (type declarations for npm package)
        run: bun run build:server

      - name: Build standalone executables (all 6 platforms)
        run: |
          mkdir -p release
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            ext=""
            [[ "$target" == win32-* ]] && ext=".exe"
            bun build --compile --target=bun-${target} ./src/cli.ts --outfile release/umans-gate-${target}${ext}
          done

      - name: Generate SHA256SUMS
        run: cd release && sha256sum umans-gate-* > SHA256SUMS

      - name: Build npm packages
        run: bash scripts/pack-npm.sh ${{ steps.ver.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{f=1; next} f && /^## \[/{exit} f" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi
          gh release create "$TAG" \
            release/umans-gate-darwin-* release/umans-gate-linux-* release/umans-gate-win32-* \
            release/SHA256SUMS \
            --title "$TAG" --notes "$NOTES"

      - name: Publish platform packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true
        run: |
          for dir in release/npm/@codegiveness/umans-gate-*/; do
            name=$(node -p "require('./${dir}package.json').name")
            for attempt in 1 2 3; do
              if (cd "$dir" && npm publish --provenance --access public 2>&1); then
                echo "✅ Published ${name} (attempt ${attempt})"
                break
              elif [ "$attempt" -eq 3 ]; then
                echo "⚠️  Failed to publish ${name} after 3 attempts — continuing anyway"
              else
                echo "⏳ Retrying ${name} in 15s..."
                sleep 15
              fi
            done
          done

      - name: Publish main shim package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd release/npm/main
          for attempt in 1 2 3; do
            if npm publish --provenance --access public 2>&1; then
              echo "✅ Published umans-gate (attempt ${attempt})"
              break
            elif [ "$attempt" -eq 3 ]; then
              echo "❌ Failed to publish umans-gate after 3 attempts"
              exit 1
            else
              echo "⏳ Retrying umans-gate in 15s..."
              sleep 15
            fi
          done
